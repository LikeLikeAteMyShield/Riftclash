<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riftclash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="quests-bg" aria-hidden="true"></canvas>
  <div id="quests-dim" aria-hidden="true"></div>
  <canvas id="decks-bg" aria-hidden="true"></canvas>
  <div id="decks-dim" aria-hidden="true"></div>
  <canvas id="library-bg" aria-hidden="true"></canvas>
  <div id="library-dim" aria-hidden="true"></div>
  <canvas id="menu-bg" aria-hidden="true"></canvas>
  <div id="menu-dim" aria-hidden="true"></div>
  <canvas id="battle-bg" aria-hidden="true"></canvas>
  <div id="battle-dim" aria-hidden="true"></div>

  <!-- The splash screen: shown over the title screen when the game opens, until the player presses a key. -->
  <section id="splash" aria-label="Riftclash. Press any key to begin." tabindex="0">
    <canvas id="splash-bg" aria-hidden="true"></canvas>
    <div class="splash-stage" aria-hidden="true">
      <svg class="splash-rings" viewBox="-500 -500 1000 1000"></svg>
      <div class="splash-sigils"></div>
      <div class="splash-title">
        <p class="splash-kicker">✦ The Rift Awakens ✦</p>
        <h1 class="splash-logo" data-text="Riftclash">Riftclash</h1>
        <p class="splash-sub">A card battle across the Rift</p>
      </div>
    </div>
    <p class="splash-prompt"><span class="keys">Press any key to begin</span><span class="touch">Tap to begin</span></p>
    <div class="splash-flash" aria-hidden="true"></div>
  </section>

  <main id="app">
    <section id="menu" class="screen">
      <h1 class="logo">Riftclash</h1>
      <p class="tagline">Choose your path</p>
      <div id="mode-grid" class="mode-grid"></div>
      <div class="menu-actions">
        <button id="decks-btn" class="btn">Deck Builder</button>
        <button id="library-btn" class="btn">Card Library</button>
        <button id="quests-btn" class="btn">Quests <span id="quests-badge" class="q-badge hidden"></span></button>
      </div>
    </section>

    <section id="play" class="screen hidden" aria-labelledby="play-title">
      <header class="play-head">
        <button id="play-back" class="btn lib-back" type="button">← Menu</button>
        <h2 id="play-title">Enter the Rift</h2>
      </header>
      <p class="tagline">Choose your champion</p>
      <div id="class-grid" class="class-grid"></div>
      <div class="menu-picks">
        <div class="opponent-pick">
          <label for="deck-select">Deck</label>
          <select id="deck-select" disabled></select>
        </div>
        <div class="opponent-pick">
          <label for="opponent-select">Opponent</label>
          <select id="opponent-select"></select>
        </div>
      </div>
      <div class="menu-actions">
        <button id="start-btn" class="btn primary" disabled>Begin battle</button>
      </div>
    </section>

    <section id="bosses" class="screen hidden" aria-labelledby="bosses-title">
      <header class="play-head">
        <button id="bosses-back" class="btn lib-back" type="button">← Menu</button>
        <h2 id="bosses-title">Challenge the Riftkin</h2>
      </header>
      <p class="tagline">Choose your foe</p>
      <div id="boss-grid" class="boss-grid"></div>
      <p class="tagline">Choose your champion</p>
      <div id="boss-class-grid" class="class-grid compact"></div>
      <div class="menu-picks">
        <div class="opponent-pick">
          <label for="boss-deck-select">Deck</label>
          <select id="boss-deck-select" disabled></select>
        </div>
      </div>
      <div class="menu-actions">
        <button id="boss-start-btn" class="btn primary" disabled>Choose a foe and a champion</button>
      </div>
    </section>

    <section id="library" class="screen hidden" aria-label="Card library"></section>
    <section id="quests" class="screen hidden" aria-label="Quests"></section>
    <section id="decks" class="screen hidden" aria-label="Deck builder"></section>

    <section id="mulligan" class="screen hidden">
      <h2 id="mulligan-title">Starting hand</h2>
      <p id="battlefield" class="battlefield"></p>
      <p class="hint">Click cards to replace them, then confirm.</p>
      <div id="mulligan-cards" class="mulligan-cards"></div>
      <button id="mulligan-btn" class="btn primary">Confirm</button>
    </section>

    <section id="table" class="hidden" aria-label="Game board"></section>
  </main>

  <aside id="log-panel">
    <h3>Battle log</h3>
    <ol id="log"></ol>
  </aside>

  <button id="sound-btn" class="sound-btn" aria-label="Sound" aria-pressed="false"></button>
  <button id="music-btn" class="sound-btn music-btn" aria-label="Music" aria-pressed="true">🎵</button>

  <div id="tooltip" class="hidden" role="tooltip"></div>
  <div id="toast" class="hidden" role="status"></div>
  <div id="banner" class="hidden"></div>

  <div id="overlay" class="hidden">
    <div class="overlay-box">
      <h2 id="result-title"></h2>
      <div id="result-banner"></div>
      <div id="result-quests"></div>
      <div class="overlay-actions">
        <button id="continue-btn" class="btn primary">Continue</button>
        <button id="again-btn" class="btn primary">Rematch</button>
        <button id="menu-btn" class="btn">Change class</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/ui.js"></script>
</body>
</html>
